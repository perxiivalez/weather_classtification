<!DOCTYPE html>
<html lang="th">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;700&display=swap" rel="stylesheet">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI พยากรณ์สภาพอากาศจากรูปภาพ</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2430; --muted:#6a7482; --accent:#2f6fed; --bar:#dfe5ee; --err:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181f; --card:#1d232d; --text:#e8ecf2; --muted:#98a2b3; --accent:#6c9cff; --bar:#2b3340; --err:#ff7b6b; } }
  body { margin:0; font-family: 'Prompt',sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.3rem; margin:0 0 4px; } p.sub { color:var(--muted); margin:0 0 20px; font-size:.9rem; }
  .card { background:var(--card); border-radius:12px; padding:16px; margin-bottom:16px; }
  input[type=file] { width:100%; }
  button { margin-top:12px; width:100%; padding:10px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:1rem; cursor:pointer; }
  img { max-width:100%; border-radius:8px; display:block; margin:12px 0 0; }
  .big { font-size:2.4rem; font-weight:700; } .row { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:.9rem; }
  .row span:first-child { width:70px; } .bar { flex:1; height:10px; background:var(--bar); border-radius:5px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); } .err { color:var(--err); }
  small { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1> ฝนจะตกมั้ยน้า : Rain2Day </h1>
  <p style="font-size: 13px; color: #999999; font-weight: 300;">
    เพื่อความแม่นยำในการประมวลผล โปรดใช้รูปที่เห็นท้องฟ้าเป็นหลัก
  </p>
  <div class="card">
    <input type="file" id="f" accept="image/*">
    <img id="pv" alt="" hidden>
    <button id="go">วิเคราะห์ภาพ</button>
  </div>
  <div class="card" id="out" hidden></div>
</main>
<script>
const f = document.getElementById('f'), pv = document.getElementById('pv'), out = document.getElementById('out');
f.onchange = () => { if (f.files[0]) { pv.src = URL.createObjectURL(f.files[0]); pv.hidden = false; } };
document.getElementById('go').onclick = async () => {
  if (!f.files[0]) return;
  const fd = new FormData(); fd.append('image', f.files[0]);
  out.hidden = false; out.textContent = 'กำลังวิเคราะห์...';
  try {
    const r = await fetch('/predict', { method: 'POST', body: fd });
    const d = await r.json();
    if (d.status === 'ok') {
      const head = d.rain_probability_percent === null
        ? '<div class="big">' + d.predicted_class + '</div>'
        : '<div class="big">' + d.rain_probability_percent + '%</div><div>โอกาสเกิดฝน</div>';
      out.innerHTML = head + '<hr style="border:0;border-top:1px solid var(--bar)">' +
        '<div>ผลจำแนก: <b>' + d.predicted_class + '</b> (มั่นใจ ' + d.confidence_percent + '%)</div>' +
        Object.entries(d.probabilities).map(([k, v]) => '<div class="row"><span>' + k + '</span><div class="bar"><i style="width:' + v + '%"></i></div><span>' + v + '%</span></div>').join('') ;
    } else {
      out.innerHTML = '<div class="err">' + (d.reasons ? 'ภาพไม่ผ่านการตรวจสอบ: ' + d.reasons.join(', ') : d.message) + '</div>';
    }
  } catch (e) { out.innerHTML = '<div class="err">เชื่อมต่อเซิร์ฟเวอร์ไม่ได้</div>'; }
};
</script>
</body>
</html>
